<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000b10">
<title>J.A.R.V.I.S Mobile Edition</title>
<link rel="stylesheet" href="./Style.css">
</head>
<body>
<header><h1>J.A.R.V.I.S</h1><p>PERSONAL AI ASSISTANT</p></header>
<main>
<section class="reactor">
  <div class="core"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="center"></div></div>
  <p class="core-text" id="system-state">SYSTEM READY</p>
</section>
<section class="status">
<h2>SYSTEM DIAGNOSTICS</h2>
<div class="row"><span>AI ENGINE</span><b id="ai-status">• WAITING FOR KEY</b></div>
<div class="row"><span>WEB SEARCH</span><b id="web-status">• READY</b></div>
<div class="row"><span>VOICE INTERFACE</span><b id="voice-status">• CHECKING</b></div>
<div class="row"><span>MEMORY</span><b id="memory-status">• ACTIVE</b></div>
</section>
<section class="search-panel">
<h2>INTERNET SEARCH</h2>
<div class="search-box"><input id="web-search-input" type="search" placeholder="Ask J.A.R.V.I.S. to search the web..."><button id="web-search-btn" type="button">SEARCH</button></div>
<p id="web-search-status">SEARCH RESULTS WILL APPEAR IN CHAT</p>
</section>
<section class="chat-panel">
<div class="chat-heading"><h2>ASSISTANT CONSOLE</h2><span>LIVE</span></div>
<div class="chat" id="chat" aria-live="polite"></div>
</section>
<section class="input-area">
<input id="msg" type="text" placeholder="Enter a command for J.A.R.V.I.S...">
<div class="controls">
<button id="send" type="button">EXECUTE</button>
<button id="mic-btn" type="button">🎤 VOICE</button>
<button id="cam-btn" type="button">📷 IMAGE</button>
<button id="clear-btn" type="button">CLEAR CHAT</button>
</div>
<input id="img-input" type="file" accept="image/*" capture="environment" hidden>
</section>
</main>
<footer>J.A.R.V.I.S MOBILE EDITION · RUNNING IN YOUR BROWSER</footer>
<script src="./Script.js" defer></script>
</body>
</html>
